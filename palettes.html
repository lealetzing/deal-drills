<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palette preview · Deal Drills</title>
<style>
  /* Internal preview: the real site in three palettes, side by side. Not linked from the site. */
  body{margin:0;background:#f2f1ee;color:#1b1b1b;font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;padding:20px 16px 40px}
  h1{font-size:22px;margin:0 0 4px} p{margin:0 0 18px;color:#555}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .tabs button{font:inherit;border:1px solid #ccc;background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
  .tabs button[aria-pressed="true"]{background:#222;color:#fff;border-color:#222}
  .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .col h2{font-size:15px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
  .sw{display:flex;gap:3px} .sw i{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.1)}
  .frame{position:relative;width:100%;aspect-ratio:1280/900;overflow:hidden;border-radius:10px;border:1px solid #ddd;background:#fff}
  .frame iframe{position:absolute;top:0;left:0;width:1280px;height:900px;border:0;transform-origin:0 0}
  .col a{font-size:13px;color:#555}
  @media (max-width:900px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Palette preview</h1>
<p>The real site in each palette. Pick a page; open a column full size with the link underneath.</p>
<div class="tabs" id="tabs"></div>
<div class="cols" id="cols"></div>
<script>
var PAGES=[['Home','index.html'],['Balance the Books','games.html?g=ledger'],['Question','games.html?g=ledger&practice=accrual,dividend,sellPPE'],['Drill','drills.html'],['Revision','revise.html'],['Leaderboard','leaderboard.html']];
var PALS=[['default','Current: navy & gold',['#f6f5f1','#ffffff','#0b1f3f','#a57b2c']],['bordeaux','Bordeaux',['#ede4d8','#d6cbbd','#afa195','#4a1f21','#2e1b1e']],['ocean','Ocean',['#eee8df','#c4bcb0','#343e64']]];
var cur=0;
function render(){
  document.getElementById('tabs').innerHTML=PAGES.map(function(p,i){return '<button data-i="'+i+'" aria-pressed="'+(i===cur)+'">'+p[0]+'</button>';}).join('');
  document.getElementById('cols').innerHTML=PALS.map(function(p){var url=PAGES[cur][1]+(PAGES[cur][1].indexOf('?')>-1?'&':'?')+'palette='+p[0];
    return '<div class="col"><h2>'+p[1]+'<span class="sw">'+p[2].map(function(c){return '<i style="background:'+c+'"></i>';}).join('')+'</span></h2>'+
      '<div class="frame"><iframe src="'+url+'" loading="lazy" title="'+p[1]+'"></iframe></div><a href="'+url+'" target="_blank">Open full size →</a></div>';}).join('');
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.onclick=function(){cur=+b.dataset.i;render();};});
  fit();
}
function fit(){[].forEach.call(document.querySelectorAll('.frame'),function(f){f.querySelector('iframe').style.transform='scale('+(f.clientWidth/1280)+')';});}
window.addEventListener('resize',fit);
render();
</script>
</body>
</html>
