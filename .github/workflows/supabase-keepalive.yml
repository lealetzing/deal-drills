# Keeps the free Supabase project active: free projects are paused after about a week without activity.
# Calls a small read-only database function every 3 days. The key is the public (publishable) key from js/config.js.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query the database
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" js/config.js | head -1)
          KEY=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" js/config.js | head -1)
          curl -fsS -X POST "$URL/rest/v1/rpc/interview_counts" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' > /dev/null
          echo "Supabase answered."
