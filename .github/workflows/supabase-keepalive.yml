# Keeps the free Supabase project active: free projects are paused after about a week without activity.
# Calls a small read-only database function every 3 days. URL and key are the public values from js/config.js
# (the publishable key ships with the site anyway). If you move to a new Supabase project, update them here too.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query the database
        run: |
          curl -fsS --max-time 30 --retry 3 --retry-delay 10 -X POST \
            "https://xhowbcwyxhicobjridyp.supabase.co/rest/v1/rpc/interview_counts" \
            -H "apikey: sb_publishable_16SNgd3vnNgwmRtKzpyWpQ_E3RooK9g" -H "Content-Type: application/json" -d '{}' > /dev/null
          echo "Supabase answered."
